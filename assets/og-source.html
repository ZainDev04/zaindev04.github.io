<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source — 1200x630</title>
<meta name="robots" content="noindex">
<!--
  Source for assets/og.png (the social share card).
  Regenerate with headless Chrome from the repo root, with the site served locally:

    chrome --headless=new --disable-gpu --hide-scrollbars \
           --virtual-time-budget=10000 --window-size=1200,630 \
           --screenshot=assets/og.png http://localhost:PORT/assets/og-source.html

  The scatter uses a seeded PRNG, so the output is byte-stable across runs.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300..600&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    position:relative;background:#0B0A09;color:#F2EDE6;
    font-family:"Source Serif 4",Georgia,serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    padding:54px 64px 48px;
  }
  /* ambient glow */
  .glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
  .g1{width:620px;height:620px;top:-230px;right:-140px;background:rgba(233,161,94,.20)}
  .g2{width:520px;height:520px;bottom:-260px;left:-160px;background:rgba(200,92,58,.16)}
  /* grain */
  .grain{
    position:absolute;inset:0;opacity:.05;pointer-events:none;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22220%22%20height%3D%22220%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%22.82%22%20numOctaves%3D%224%22%20stitchTiles%3D%22stitch%22%2F%3E%3CfeColorMatrix%20type%3D%22saturate%22%20values%3D%220%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url(%23n)%22%2F%3E%3C%2Fsvg%3E");
  }
  .layer{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}

  .mark{display:flex;align-items:center;gap:13px}
  .glyph{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(145deg,#F4B776,#E9A15E);color:#0B0A09;
    font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:500;
  }
  .name{
    font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:500;
    letter-spacing:.2em;text-transform:uppercase;color:#F2EDE6;
  }

  h1{
    margin-top:38px;
    font-family:"Fraunces",Georgia,serif;font-weight:400;
    font-size:51px;line-height:1.1;letter-spacing:-.025em;
    font-variation-settings:"opsz" 144,"SOFT" 24,"WONK" 1;
    max-width:1020px;
  }
  h1 .lit{
    font-style:italic;
    background:linear-gradient(100deg,#F4B776,#E9A15E);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-variation-settings:"opsz" 144,"SOFT" 40,"WONK" 1;
  }
  .sub{
    margin-top:16px;padding-left:16px;border-left:2px solid #E9A15E;
    font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:25px;
    line-height:1.3;letter-spacing:-.015em;color:#F2EDE6;
    font-variation-settings:"opsz" 144,"SOFT" 40,"WONK" 1;
  }

  .fig{margin-top:42px}
  canvas{display:block}

  .foot{
    margin-top:auto;display:flex;align-items:center;gap:14px;
    font-family:"JetBrains Mono",monospace;font-size:13px;
    letter-spacing:.06em;color:#9A9189;
  }
  .foot .dot{width:4px;height:4px;border-radius:50%;background:#9A9189;opacity:.7}
  .foot .site{color:#E9A15E}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="layer">
  <div class="mark">
    <span class="glyph">SZ</span>
    <span class="name">Shaikh Muhammad Zain</span>
  </div>

  <h1>I take messy production data from raw rows to a <span class="lit">decision</span> a team can act on.</h1>
  <p class="sub">And I publish what didn&rsquo;t work.</p>

  <div class="fig">
    <canvas id="c" width="1072" height="200"></canvas>
  </div>

  <div class="foot">
    <span class="site">zaindev04.github.io</span>
    <span class="dot"></span>
    <span>FlyRank AI Internship — Machine Learning</span>
    <span class="dot"></span>
    <span>18,752 pages · 5 of 6 archetypes kept</span>
  </div>
</div>

<div class="grain"></div>

<script>
// Seeded PRNG so the rendered card is identical on every regeneration.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296}}
var rnd = mulberry32(20042004);

var GROUPS=[
  {n:250,label:'3,365',hi:false},
  {n:218,label:'2,920',hi:false},
  {n:58, label:'735',  hi:true },
  {n:46, label:'588',  hi:false},
  {n:40, label:'522',  hi:false}
];

var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=cv.width, H=cv.height, slot=W/GROUPS.length, CY=86;

GROUPS.forEach(function(g,k){
  var cx=slot*k+slot/2;
  var r=Math.min(68,Math.sqrt(g.n)*4.3);
  for(var j=0;j<g.n;j++){
    var a=rnd()*Math.PI*2, rr=Math.sqrt(rnd());
    var x=cx+Math.cos(a)*rr*r, y=CY+Math.sin(a)*rr*r*0.92;
    ctx.beginPath();
    if(g.hi){
      ctx.fillStyle='#E9A15E';ctx.globalAlpha=1;
      ctx.shadowColor='#E9A15E';ctx.shadowBlur=8;
      ctx.arc(x,y,2.9,0,6.2832);ctx.fill();ctx.shadowBlur=0;
    }else{
      ctx.fillStyle='#9A9189';ctx.globalAlpha=.5;
      ctx.arc(x,y,2.3,0,6.2832);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  ctx.font='500 14px "JetBrains Mono",monospace';
  ctx.textAlign='center';
  ctx.fillStyle=g.hi?'#E9A15E':'#9A9189';
  ctx.fillText(g.label,cx,H-4);
});
</script>
</body>
</html>
